# Overrides applied on top of the open-telemetry/opentelemetry-demo chart via
#   helm upgrade my-otel-demo open-telemetry/opentelemetry-demo -f otel-new-values.yaml
#
# The prometheus subchart's configmap template concatenates three sources into
# the rendered prometheus.yml scrape_configs list:
#   1. prometheus.scrapeConfigs                            (map, chart default)
#   2. prometheus.serverFiles."prometheus.yml".scrape_configs  (legacy array — this file)
#   3. prometheus.extraScrapeConfigs                       (string)
# So we only need to add the jobs that the chart does NOT already emit.
# See charts/prometheus/templates/cm.yaml in the chart for the template.

prometheus:
  serverFiles:
    prometheus.yml:
      scrape_configs:
        # The otel demo's bundled Prometheus does not scrape kube-state-metrics
        # by default. The CrashLoopBackOff alert uses
        # `kube_pod_container_status_waiting_reason`, which is only published by
        # ksm — so we add this job to make that metric available.
        - job_name: kube-state-metrics
          static_configs:
            - targets:
                - kube-state-metrics.kube-system.svc.cluster.local:8080
